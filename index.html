

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Talk Studio</title>

<style>

*{box-sizing:border-box}

body{

 margin:0;background:#f5f5f8;color:#222;

 font-family:Arial,Helvetica,sans-serif

}

header{

 height:65px;background:white;border-bottom:1px solid #eee;

 display:flex;align-items:center;padding:0 25px;

 font-size:21px;font-weight:bold;letter-spacing:-1px

}

header span{color:#7957df}

main{max-width:1050px;margin:35px auto;padding:0 20px}

h1{font-size:31px;margin-bottom:7px}

.sub{color:#888;font-size:14px;margin-bottom:25px}

.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}

.panel{

 background:white;padding:22px;border-radius:14px;

 box-shadow:0 3px 15px #00000008

}

h2{font-size:17px;margin:0 0 18px}

.upload{

 display:block;border:2px dashed #d8d5e2;

 border-radius:12px;text-align:center;padding:25px;

 cursor:pointer;color:#777

}

.upload:hover{border-color:#7957df}

input[type=file]{display:none}

.preview{

 background:#eeeef2;border-radius:12px;margin-top:15px;

 min-height:280px;display:flex;align-items:center;

 justify-content:center;overflow:hidden

}

canvas{display:none;max-width:100%;max-height:450px}

#placeholder{color:#999;font-size:13px}

label{

 display:block;font-size:13px;font-weight:bold;

 margin:19px 0 8px

}

textarea,select{

 width:100%;padding:12px;border:1px solid #ddd;

 border-radius:8px;background:white;font:14px Arial;

 outline:none

}

textarea{height:105px;resize:vertical}

textarea:focus,select:focus{border-color:#7957df}

button{

 border:0;border-radius:8px;padding:13px;

 cursor:pointer;font-weight:bold;font-size:14px

}

.primary{width:100%;background:#7957df;color:white;margin-top:20px}

.primary:hover{background:#6241c6}

.secondary{background:#eeeafa;color:#6546bd;flex:1}

.controls{display:flex;gap:10px;margin-top:10px}

.status{font-size:12px;color:#888;margin-top:13px;line-height:1.5}

footer{text-align:center;color:#aaa;font-size:11px;padding:35px}

@media(max-width:700px){

 .layout{grid-template-columns:1fr}

 main{margin-top:23px}

}

</style>

</head>

<body>

<header>Talk<span>Studio</span></header>

<main>

<h1>Make your photos talk.</h1>

<p class="sub">An AI-powered talking photograph studio.</p>

<div class="layout">

<section class="panel">

<h2>01 — Photograph</h2>

<label class="upload">

<input type="file" id="photo" accept="image/*">

<div style="font-size:30px">＋</div>

<strong>Upload a photograph</strong>

<p style="font-size:12px">Choose a JPG, PNG or WebP</p>

</label>

<div class="preview">

<div id="placeholder">Your photograph will appear here.</div>

<canvas id="canvas"></canvas>

</div>

<p class="status" id="faceStatus">Waiting for photograph.</p>

</section>

<section class="panel">

<h2>02 — Animation studio</h2>

<label for="script">What should they say?</label>

<textarea id="script" placeholder="Type what you want the person to say..."></textarea>

<label for="emotion">Facial expression</label>

<select id="emotion">

<option value="neutral">Neutral</option>

<option value="happy">Happy</option>

<option value="sad">Sad</option>

<option value="angry">Angry</option>

</select>

<label for="voice">Voice</label>

<select id="voice"></select>

<label for="speed">Speaking speed</label>

<select id="speed">

<option value=".75">Slow</option>

<option value="1" selected>Normal</option>

<option value="1.15">Fast</option>

<option value="1.3">Very fast</option>

</select>

<button class="primary" id="generate">Generate talking photo</button>

<div class="controls">

<button class="secondary" id="stop">Stop</button>

<button class="secondary" id="replay">Replay</button>

</div>

<p class="status" id="status">Upload a photograph to begin.</p>

</section>

</div>

</main>

<footer>TALK STUDIO · VERSION 1.0</footer>

<script type="module">

import {

 FaceLandmarker,

 FilesetResolver

} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const photo = document.getElementById("photo");

const canvas = document.getElementById("canvas");

const ctx = canvas.getContext("2d");

const status = document.getElementById("status");

const faceStatus = document.getElementById("faceStatus");

const script = document.getElementById("script");

const emotion = document.getElementById("emotion");

const voiceSelect = document.getElementById("voice");

const speed = document.getElementById("speed");

let ai = null;

let image = null;

let landmarks = null;

let mouth = null;

let animation = null;

let speaking = false;

let currentText = "";

let lastUtterance = null;

let mouthPhase = 0;

const $ = id => document.getElementById(id);

// LOAD AI

async function loadAI(){

 status.textContent = "Loading facial recognition AI...";

 try{

  const vision = await FilesetResolver.forVisionTasks(

   "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"

  );

  ai = await FaceLandmarker.createFromOptions(vision,{

   baseOptions:{

    modelAssetPath:

    "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

    delegate:"GPU"

   },

   runningMode:"IMAGE",

   numFaces:1,

   outputFaceBlendshapes:true

  });

  status.textContent = "AI facial recognition ready.";

 }catch(error){

  console.error(error);

  status.textContent = "AI could not load. Check your internet connection.";

 }

}

loadAI();

// LOAD VOICES

function loadVoices(){

 const voices = speechSynthesis.getVoices();

 voiceSelect.innerHTML = "";

 voices.forEach((voice,index)=>{

  const option = document.createElement("option");

  option.value = index;

  option.textContent = voice.name + " (" + voice.lang + ")";

  voiceSelect.appendChild(option);

 });

 if(!voices.length){

  const option = document.createElement("option");

  option.textContent = "Default browser voice";

  option.value = "";

  voiceSelect.appendChild(option);

 }

}

speechSynthesis.onvoiceschanged = loadVoices;

loadVoices();

// PHOTO UPLOAD

photo.addEventListener("change",event=>{

 const file = event.target.files[0];

 if(!file)return;

 if(!file.type.startsWith("image/")){

  alert("Please select an image.");

  return;

 }

 const reader = new FileReader();

 reader.onload = ()=>{

  const img = new Image();

  img.onload = ()=>{

   stopAnimation();

   image = img;

   canvas.width = img.naturalWidth;

   canvas.height = img.naturalHeight;

   $("placeholder").style.display = "none";

   canvas.style.display = "block";

   detectFace();

  };

  img.src = reader.result;

 };

 reader.readAsDataURL(file);

});

// FACIAL LANDMARK DETECTION

function detectFace(){

 if(!ai || !image){

  faceStatus.textContent = "AI is still loading.";

  return;

 }

 try{

  const result = ai.detect(image);

  if(!result.faceLandmarks.length){

   landmarks = null;

   mouth = null;

   draw();

   faceStatus.textContent = "No face detected. Try a front-facing portrait.";

   return;

  }

  landmarks = result.faceLandmarks[0];

  // Inner and outer lip landmarks

  const outerIndices = [61,146,91,181,84,17,314,405,321,375,291,

                        308,324,318,402,317,14,87,178,88,95,78];

  const innerIndices = [78,191,80,81,82,13,312,311,310,415,308,

                        324,318,402,317,14,87,178,88,95];

  mouth = {

   outer: outerIndices.map(i=>landmarks[i]),

   inner: innerIndices.map(i=>landmarks[i]),

   left:landmarks[61],

   right:landmarks[291],

   top:landmarks[13],

   bottom:landmarks[14]

  };

  faceStatus.textContent =

   "Face detected · 478 landmarks tracked · Mouth located.";

  draw();

  status.textContent = "Your photograph is ready.";

 }catch(error){

  console.error(error);

  status.textContent = "Face detection failed.";

 }

}

// DRAW PHOTOGRAPH AND ANIMATED MOUTH

function draw(){

 if(!image)return;

 ctx.clearRect(0,0,canvas.width,canvas.height);

 ctx.drawImage(image,0,0);

 if(!mouth)return;

 const scaleX = canvas.width;

 const scaleY = canvas.height;

 const outer = mouth.outer.map(p=>({

  x:p.x*scaleX,y:p.y*scaleY

 }));

 const inner = mouth.inner.map(p=>({

  x:p.x*scaleX,y:p.y*scaleY

 }));

 // Reconstruct the mouth opening

 // using the detected lip outline.

 const opening = speaking ? mouthPhase : 0.04;

 const emotionValue = emotion.value;

 let emotionCurve = 0;

 if(emotionValue==="happy") emotionCurve=-0.10;

 if(emotionValue==="sad") emotionCurve=0.10;

 if(emotionValue==="angry") emotionCurve=0.03;

 const centerX = (mouth.left.x+mouth.right.x)/2*scaleX;

 const centerY = (mouth.top.y+mouth.bottom.y)/2*scaleY;

 const width = Math.hypot(

  (mouth.right.x-mouth.left.x)*scaleX,

  (mouth.right.y-mouth.left.y)*scaleY

 );

 const height = Math.max(

  2,

  Math.hypot(

   (mouth.bottom.x-mouth.top.x)*scaleY,

   (mouth.bottom.y-mouth.top.y)*scaleY

  )

 );

 // Clip animation to detected mouth region

 ctx.save();

 ctx.beginPath();

 outer.forEach((p,i)=>{

  if(i===0)ctx.moveTo(p.x,p.y);

  else ctx.lineTo(p.x,p.y);

 });

 ctx.closePath();

 ctx.clip();

 // Mouth interior

 ctx.fillStyle = "#3c1119";

 ctx.beginPath();

 const openHeight = Math.max(

  1,

  height*(0.15+opening*2.5)

 );

 ctx.ellipse(

  centerX,

  centerY,

  width*0.43,

  openHeight,

  0,0,Math.PI*2

 );

 ctx.fill();

 // Darken interior for an open-mouth effect

 if(speaking && opening>0.16){

  ctx.fillStyle = "#17070b";

  ctx.beginPath();

  ctx.ellipse(

   centerX,centerY,

   width*0.27,

   openHeight*0.6,

   0,0,Math.PI*2

  );

  ctx.fill();

 }

 // Lip contour

 ctx.strokeStyle = "rgba(110,30,50,.55)";

 ctx.lineWidth = Math.max(1,width*.025);

 ctx.beginPath();

 outer.forEach((p,i)=>{

  if(i===0)ctx.moveTo(p.x,p.y);

  else ctx.lineTo(p.x,p.y);

 });

 ctx.closePath();

 ctx.stroke();

 ctx.restore();

}

// SPEECH

function speak(){

 if(!image || !mouth){

  status.textContent = "Please upload a photograph with a detectable face.";

  return;

 }

 currentText = script.value.trim();

 if(!currentText){

  status.textContent = "Please enter something for the photograph to say.";

  return;

 }

 stopAnimation();

 const utterance = new SpeechSynthesisUtterance(currentText);

 lastUtterance = utterance;

 const voices = speechSynthesis.getVoices();

 const selected = voices[Number(voiceSelect.value)];

 if(selected)utterance.voice=selected;

 utterance.rate=Number(speed.value);

 // Emotional voice settings

 if(emotion.value==="happy"){

  utterance.pitch=1.25;

 }

 else if(emotion.value==="sad"){

  utterance.pitch=.75;

  utterance.rate*=.85;

 }

 else if(emotion.value==="angry"){

  utterance.pitch=1.15;

  utterance.rate*=1.05;

 }

 else{

  utterance.pitch=1;

 }

 utterance.onstart=()=>{

  speaking=true;

  status.textContent="Speaking...";

  animateMouth();

 };

 utterance.onend=()=>{

  speaking=false;

  mouthPhase=0;

  cancelAnimationFrame(animation);

  draw();

  status.textContent="Finished speaking.";

 };

 utterance.onerror=()=>{

  speaking=false;

  cancelAnimationFrame(animation);

  draw();

  status.textContent="Speech could not be played.";

 };

 speechSynthesis.speak(utterance);

}

// MOUTH MOVEMENT

function animateMouth(){

 if(!speaking)return;

 mouthPhase =

  0.1 + Math.abs(Math.sin(Date.now()/75))*.65;

 // Change mouth movement slightly over time

 mouthPhase *= .65 + Math.random()*.55;

 draw();

 animation=requestAnimationFrame(animateMouth);

}

// STOP

function stopAnimation(){

 speechSynthesis.cancel();

 speaking=false;

 mouthPhase=0;

 cancelAnimationFrame(animation);

 draw();

}

$("generate").addEventListener("click",speak);

$("stop").addEventListener("click",()=>{

 stopAnimation();

 status.textContent="Animation stopped.";

});

$("replay").addEventListener("click",speak);

emotion.addEventListener("change",()=>{

 if(!speaking)draw();

});

</script>

</body>

</html>
